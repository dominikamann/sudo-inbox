name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bats and shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck
      - name: shellcheck
        run: shellcheck sudo-inbox test/helpers/bin/sudo
      - name: bats
        run: bats test
