name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats and shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq bats shellcheck && sudo mkdir -p /srv/root-env
      - name: shellcheck
        run: shellcheck sudo-inbox test/helpers/bin/sudo
      - name: bats
        run: bats test
